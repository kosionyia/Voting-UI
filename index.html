<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title> Hackathon Voting Sytem</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-blue-100">

<div class="max-w-5xl mx-auto p-6">



    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold">
        Voting System
        </h1>
<br>
        <p class="text-gray-600">
            Head of Cohort Election
        </p>

        <p class="mt-2 text-lg">
            Total Members: <span class="font-bold">20</span>
        </p>

        <p>
            Votes Cast:
            <span id="votesCast" class="font-bold text-blue-600">0</span>/20
        </p>
    </div>

    <div class="max-w-sm rounded-xl overflow-hidden shadow-lg bg-white p-6 border border-gray-100">
  <h3 class="text-lg font-semibold text-gray-800 mb-2">Select Your Name </h3>
  <p class="text-sm text-gray-500 mb-4">Choose a name from the list below.</p>
  
  <!-- Dropdown Container -->
  <div class="relative">
    <select class="w-full bg-gray-50 border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
      <option selected>Choose a name</option>
      <option value="1">Austin</option>
      <option value="2">Majesty</option>
      <option value="3">Bonavee</option>
      <option value="4">Ifeanyi</option>
      <option value="5">Amara</option>
      <option value="6">Rita</option>
    </select>
  </div>
</div>

    <br>
    <br>
        <div class="bg-white rounded-lg relative shadow px-6 py-12">
          
<button class="rounded-md bg-blue-500 px-2.5 py-1.5 text-sm font-semibold absolute right-4 text-white inset-ring inset-ring-white/5 bottom-2 hover:bg-teal-400">Record Vote</button>
        <h2 class="text-xl text-center font-bold mb-4">
            Cast Your Vote
        </h2>

        <table class="w-full border">

            <form class="max-w-sm mx-auto">
            <label for="countries" class="block mb-2.5 text-sm font-medium text-heading">Candidate</label>
            <select id="countries" class="block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body">
                <option selected>Select Candidate</option>
              
                <option value="kosi">Kosi</option>
                <option value="austine">Austine</option>

            </select>
            </form>



        </table>

    </div>

    
    <br>
    <br>







<div class="flex justify-end w-full">
  <card class="px-4 py-2 bg-teal-600 text-white rounded">
    <h1>voter count</h1>
    <h3>Candidate1:</h3>
    <h3>Candidate2:</h3>
  </card>



</div>

<!-- Include this script tag or install `@tailwindplus/elements` via npm: -->
<!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script> -->
<button command="show-modal" commandfor="dialog" class="rounded-md bg-blue-500 px-2.5 py-1.5 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-teal-400">Check Result</button>
<el-dialog>
  <dialog id="dialog" aria-labelledby="dialog-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
    <el-dialog-backdrop class="fixed inset-0 bg-gray-900/50 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"></el-dialog-backdrop>

    <div tabindex="0" class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
      <el-dialog-panel class="relative transform overflow-hidden rounded-lg bg-gray-800 text-left shadow-xl outline -outline-offset-1 outline-white/10 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-lg data-closed:sm:translate-y-0 data-closed:sm:scale-95">
        <div class="bg-gray-800 px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <div class="sm:flex sm:items-start">
            <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-red-500/10 sm:mx-0 sm:size-10">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6 text-red-400">
                <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
              <h3 id="dialog-title" class="text-base font-semibold text-white">Record My Vote</h3>
              <div class="mt-2">
                <p class="text-sm text-gray-400">Are you sure you want to Vote the selected Candidate.</p>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-gray-700/25 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
          <button type="button" command="close" commandfor="dialog" class="inline-flex w-full justify-center rounded-md bg-red-500 px-3 py-2 text-sm font-semibold text-white hover:bg-red-400 sm:ml-3 sm:w-auto">Vote</button>
          <button type="button" command="close" commandfor="dialog" class="mt-3 inline-flex w-full justify-center rounded-md bg-white/10 px-3 py-2 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-white/20 sm:mt-0 sm:w-auto">Cancel</button>
        </div>
      </el-dialog-panel>
    </div>
  </dialog>
</el-dialog>


</body>
</html>
